# safehome.devupii.store — 웹 프론트와 API 를 **같은 출처**로 묶는다.
#
# 같은 출처여야 하는 이유: 비회원 분석의 주인을 가리는 쿠키가 `Secure` + `path=/api` 로 내려온다.
# 웹과 API 가 다른 호스트에 있으면 그 쿠키가 실리지 않아, 업로드한 사람이 자기 결과를 보지 못한다.
#
# **이 파일이 원본이고 서버의 `/etc/nginx/sites-available/safehome` 이 사본이다.**
# 고칠 때 이 파일을 고치고 서버로 옮긴다. 서버에서만 고치면 다음 재구축 때 사라진다.
#
# TLS 줄(`listen 443 ssl` · `ssl_certificate` …)은 certbot 이 붙인다. 여기에 적지 않는다 —
# 적어 두면 certbot 이 갱신할 때 어느 쪽이 참인지 알 수 없게 된다.

server {
    server_name safehome.devupii.store;

    # nginx 기본값은 1m 이라 등기부등본 PDF 가 여기서 먼저 막힌다.
    # 넉넉히 두어 **한도를 판단하는 곳을 애플리케이션 한 곳으로 모은다.**
    client_max_body_size 20m;

    # API. proxy_pass 에 경로를 붙이지 않는다 — 붙이면 `/api` 가 잘려 나가 전부 404 가 된다.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 진행 상황 스트림(SSE). 셋 중 하나라도 빠지면 단계 표시가 동작하지 않는다.
        #   buffering  — 켜져 있으면 이벤트를 모았다가 끝에 한 번에 내보낸다
        #   read_timeout — 기본 60초. 분석 서버가 버티는 300초보다 길어야 한다
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 310s;
    }

    # 웹 프론트.
    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}
