services:
  safehome-web:
    image: ghcr.io/${GITHUB_OWNER}/safehome-web:dev
    container_name: safehome-web-dev
    environment:
      TZ: Asia/Seoul
    # 앞단 nginx 만 닿으면 된다. 밖으로 직접 열면 TLS 를 건너뛰는 경로가 생기고,
    # 그 경로로 들어온 요청은 비회원 쿠키(Secure)를 받지 못해 분석의 주인이 사라진다.
    # postgres·redis 와 같은 이유로 루프백에만 묶는다.
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - safehome-net
    restart: unless-stopped
    # 헬스체크는 여기 두지 않는다. 이미지의 HEALTHCHECK 를 그대로 쓴다 —
    # 여기에 또 적으면 이미지 쪽을 덮어써, CI 가 검사한 것과 서버가 보는 것이 달라진다.

networks:
  safehome-net:
    external: true
